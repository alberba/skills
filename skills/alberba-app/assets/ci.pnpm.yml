name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # Con base de datos: añadir `services:` con postgres:{{postgres}} y, en `env:`, los secretos
    # falsos marcados «solo para CI» (DATABASE_URL y los que pida la auth).
    steps:
      - uses: actions/checkout@{{checkout}}
      - uses: pnpm/action-setup@{{pnpm-action}}
      - uses: actions/setup-node@{{setup-node}}
        with:
          node-version: {{node}}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@{{upload-artifact}}
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
