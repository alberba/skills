  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [patch, minor]
      development:
        dependency-type: development
        update-types: [minor, patch]
      other-maintenance:
        patterns: ["*"]
        update-types: [patch, minor]
