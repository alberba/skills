name: Dependency audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@{{checkout}}
      - uses: pnpm/action-setup@{{pnpm-action}}
      - uses: actions/setup-node@{{setup-node}}
        with:
          node-version: {{node}}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        shell: bash
        run: pnpm audit:prod 2>&1 | tee audit.txt
      - name: Open an issue when the audit fails
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Auditoría de dependencias de producción en rojo'
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length' | grep -qx 0; then
            gh issue create --title "$title" --body-file audit.txt
          fi
