name: Mobile checks
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@{{checkout}}
      - uses: actions/setup-java@{{setup-java}}
        with:
          distribution: temurin
          java-version: {{java}}
      - uses: subosito/flutter-action@{{flutter-action}}
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
