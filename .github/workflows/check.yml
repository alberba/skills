name: Check skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  product-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.0 ruff
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m playwright install --with-deps chromium
      - run: ruff check skills/product-video/scripts benchmarks/product-video/test_product_video.py --select F
      - run: python -m unittest discover -s benchmarks/product-video -p 'test_*.py' -v
